name: milFunny
version: '${version}'

main: io.github.millymilo00.milFunny.MilFunny
api-version: '1.14'

commands:
  opme:
    description: op yourself for an hour (requires perms)
    usage: /opme
  milfunny:
    description: Admin command to manage this plugin
    usage: /milfunny - shows help
    aliases: [mf]
    permission: milfunny.admin
  vote:
    description: lets people vote for op
    usage: /vote username [yes|no]

permissions:
  milfunny.admin:
    description: Permission for the /milfunny /mf command
    default: op